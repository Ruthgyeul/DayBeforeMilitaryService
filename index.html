<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-DAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c1: #4a5240;
      --c1-dark: #2e3328;
      --c1-light: #7a8c6e;
      --c2: #b5a97a;
      --cream: #f0ead8;
      --red: #c0392b;
      --bg: #1a1c17;
      --accent: #c0392b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--cream);
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
      transition: background 2s ease;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(74,82,64,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,82,64,0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 0;
    }

    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 2rem;
    }

    .badge {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--c2);
      border: 1px solid var(--c1-light);
      padding: 0.35rem 1.2rem;
      text-transform: uppercase;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeDown 0.8s 0.2s forwards;
    }

    .name-label {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--cream);
      letter-spacing: 0.4em;
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeDown 0.8s 0.35s forwards;
    }

    .dday-wrapper {
      display: flex;
      align-items: baseline;
      gap: 0.2rem;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.5s forwards;
    }

    .dday-prefix {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      color: var(--c1-light);
      letter-spacing: -0.02em;
    }

    .dday-number {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(6rem, 20vw, 14rem);
      color: var(--cream);
      line-height: 0.85;
      letter-spacing: -0.04em;
    }

    .date-line {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.7s forwards;
    }

    .date-line::before,
    .date-line::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--c1-light));
    }
    .date-line::after {
      background: linear-gradient(90deg, var(--c1-light), transparent);
    }

    .date-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 300;
      font-size: 0.9rem;
      letter-spacing: 0.25em;
      color: var(--c2);
      white-space: nowrap;
    }

    .time-row {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.9s forwards;
    }

    .time-unit { text-align: center; }

    .time-num {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: var(--cream);
      display: block;
      line-height: 1;
    }

    .time-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--c1-light);
      text-transform: uppercase;
      margin-top: 0.3rem;
      display: block;
    }

    .time-sep {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2rem;
      color: var(--c1);
      align-self: flex-start;
      padding-top: 0.1rem;
    }

    .message {
      font-size: clamp(0.75rem, 1.5vw, 0.85rem);
      font-weight: 300;
      color: var(--c1-light);
      letter-spacing: 0.05em;
      text-align: center;
      max-width: 440px;
      line-height: 1.8;
      opacity: 0;
      animation: fadeUp 0.8s 1.1s forwards;
      transition: opacity 0.6s;
      min-height: 3em;
    }

    .message strong { color: var(--c2); font-weight: 700; }

    .onesec {
      margin-top: 0.6rem;
      font-size: 0.7rem;
      font-weight: 300;
      color: var(--c1-light);
      letter-spacing: 0.04em;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.8s 1.2s forwards;
      transition: opacity 0.5s;
      min-height: 1.5em;
    }

    .onesec span { color: var(--c2); font-weight: 700; }

    .stats-row {
      display: flex;
      gap: 0.8rem;
      width: 100%;
      max-width: 560px;
      margin-top: 1.4rem;
      opacity: 0;
      animation: fadeUp 0.8s 1.3s forwards;
    }

    .stat-card {
      flex: 1;
      border: 1px solid var(--c1);
      padding: 0.85rem 0.75rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(74,82,64,0.07);
      pointer-events: none;
    }

    .stat-title {
      font-size: 0.52rem;
      letter-spacing: 0.15em;
      color: var(--c1-light);
      text-transform: uppercase;
    }

    .stat-value {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.45rem);
      color: var(--cream);
      line-height: 1;
    }

    .stat-sub {
      font-size: 0.58rem;
      color: var(--c2);
      letter-spacing: 0.04em;
      line-height: 1.5;
    }

    .stat-bar {
      width: 100%;
      height: 2px;
      background: var(--c1-dark);
      margin-top: 0.15rem;
    }

    .stat-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--c1-light), var(--c2));
      transition: width 1s linear;
    }

    .stamp {
      position: fixed;
      bottom: 2rem;
      right: 2.5rem;
      opacity: 0;
      animation: fadeIn 1s 1.5s forwards;
    }

    .stamp-inner {
      border: 2px solid var(--accent);
      padding: 0.4rem 0.9rem;
      transform: rotate(-8deg);
      font-family: 'Black Han Sans', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      color: var(--accent);
      opacity: 0.6;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-15px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .blink { animation: pulse 1s infinite; }
  </style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="container">
  <div class="badge" id="badge">MANDATORY MILITARY SERVICE</div>
  <div class="name-label" id="name-label">---</div>

  <div class="dday-wrapper">
    <span class="dday-prefix">D-</span>
    <span class="dday-number" id="dday">---</span>
  </div>

  <div class="date-line">
    <span class="date-text" id="date-text">---- -- -- 입대</span>
  </div>

  <div class="time-row">
    <div class="time-unit">
      <span class="time-num" id="hours">--</span>
      <span class="time-label">시간</span>
    </div>
    <span class="time-sep">:</span>
    <div class="time-unit">
      <span class="time-num" id="minutes">--</span>
      <span class="time-label">분</span>
    </div>
    <span class="time-sep">:</span>
    <div class="time-unit">
      <span class="time-num blink" id="seconds">--</span>
      <span class="time-label">초</span>
    </div>
  </div>

  <div class="message" id="message">
    지금 이 순간에도 시간은 흐르고 있다.<br>
    <strong>도망칠 수 없다.</strong>
  </div>

  <div class="onesec" id="onesec"></div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-title">전역까지</div>
      <div class="stat-value" id="discharge-days">---일</div>
      <div class="stat-sub" id="discharge-date">--</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="discharge-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-title">오늘의 자유</div>
      <div class="stat-value" id="today-remain">--:--</div>
      <div class="stat-sub">자정까지 남은 시간</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="today-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-title">인생 헌납률</div>
      <div class="stat-value" id="life-pct">--%</div>
      <div class="stat-sub" id="life-sub">평균수명 83세 기준<br>군대에 뺏기는 시간</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="life-bar" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="stamp">
  <div class="stamp-inner" id="stamp-text">입영 예정</div>
</div>

<script>
  // ── 군종 테마 ──
  const THEMES = {
    '육군': {
      label:  '대한민국 육군 / REPUBLIC OF KOREA ARMY',
      badge:  'REPUBLIC OF KOREA ARMY',
      stamp:  '입영 예정',
      service: 18,
      bg:     { h: 82,  s: 8,  lMin: 5,  lMax: 17 },
      vars: {
        '--c1':       '#4a5240',
        '--c1-dark':  '#2e3328',
        '--c1-light': '#7a8c6e',
        '--c2':       '#b5a97a',
        '--accent':   '#c0392b',
        '--bg':       '#1a1c17',
      },
      grid: 'rgba(74,82,64,0.15)',
    },
    '공군': {
      label:  '대한민국 공군 / REPUBLIC OF KOREA AIR FORCE',
      badge:  'REPUBLIC OF KOREA AIR FORCE',
      stamp:  '입영 예정',
      service: 21,
      bg:     { h: 210, s: 25, lMin: 5,  lMax: 14 },
      vars: {
        '--c1':       '#1e3a5f',
        '--c1-dark':  '#0f2035',
        '--c1-light': '#4a82b8',
        '--c2':       '#7ab3d4',
        '--accent':   '#4a82b8',
        '--bg':       '#0a1520',
      },
      grid: 'rgba(74,130,184,0.12)',
    },
    '해군': {
      label:  '대한민국 해군 / REPUBLIC OF KOREA NAVY',
      badge:  'REPUBLIC OF KOREA NAVY',
      stamp:  '입영 예정',
      service: 20,
      bg:     { h: 220, s: 30, lMin: 4,  lMax: 12 },
      vars: {
        '--c1':       '#1a2744',
        '--c1-dark':  '#0d1628',
        '--c1-light': '#3a5a8a',
        '--c2':       '#c8a84b',
        '--accent':   '#c8a84b',
        '--bg':       '#080e1a',
      },
      grid: 'rgba(58,90,138,0.15)',
    },
    '해병대': {
      label:  '대한민국 해병대 / REPUBLIC OF KOREA MARINE CORPS',
      badge:  'REPUBLIC OF KOREA MARINE CORPS',
      stamp:  '귀신 잡는 해병',
      service: 18,
      bg:     { h: 0,   s: 30, lMin: 5,  lMax: 13 },
      vars: {
        '--c1':       '#5c1a1a',
        '--c1-dark':  '#3a0f0f',
        '--c1-light': '#a03030',
        '--c2':       '#d4a04a',
        '--accent':   '#cc2200',
        '--bg':       '#140808',
      },
      grid: 'rgba(160,48,48,0.15)',
    },
  };

  // ── URL 파라미터 파싱 ──
  // 지원 형식:
  //   ?branch=육군&name=유한빈&date=20260928
  const params  = new URLSearchParams(window.location.search);
  const branch  = params.get('branch') || '육군';
  const name    = params.get('name')   || '유한빈';
  const dateRaw = params.get('date')   || '20260928';

  // dateRaw: YYYYMMDD → Date
  const yr  = parseInt(dateRaw.slice(0,4));
  const mo  = parseInt(dateRaw.slice(4,6)) - 1;
  const dy  = parseInt(dateRaw.slice(6,8));
  const ENLIST = new Date(yr, mo, dy, 6, 0, 0);

  const theme = THEMES[branch] || THEMES['육군'];

  // 복무 기간
  const DISCHARGE = new Date(ENLIST);
  DISCHARGE.setMonth(DISCHARGE.getMonth() + theme.service);

  const BIRTH   = new Date('2003-01-01T00:00:00');
  const LIFE_END = new Date(BIRTH);
  LIFE_END.setFullYear(LIFE_END.getFullYear() + 83);

  // ── 테마 적용 ──
  const root = document.documentElement;
  Object.entries(theme.vars).forEach(([k, v]) => root.style.setProperty(k, v));

  // 격자 색상 교체
  document.querySelector('body::before');
  const gridStyle = document.createElement('style');
  gridStyle.textContent = `body::before { background-image: linear-gradient(${theme.grid} 1px, transparent 1px), linear-gradient(90deg, ${theme.grid} 1px, transparent 1px) !important; }`;
  document.head.appendChild(gridStyle);

  document.getElementById('badge').textContent      = theme.badge;
  document.getElementById('name-label').textContent = name;
  document.getElementById('stamp-text').textContent = theme.stamp;

  // 날짜 포맷
  function pad(n) { return String(n).padStart(2, '0'); }
  function formatDate(d) {
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
  }
  document.getElementById('date-text').textContent = formatDate(ENLIST) + ' 입대';

  // ── title 업데이트 ──
  document.title = `${name} D-DAY`;

  // ── 배경 어둡기 ──
  const TODAY_REF = new Date(); TODAY_REF.setHours(0,0,0,0);
  const TOTAL_DAYS = Math.max(1, Math.ceil((ENLIST - TODAY_REF) / 86400000));

  function updateBg(daysLeft) {
    const { h, s, lMin, lMax } = theme.bg;
    const ratio = Math.max(0, Math.min(1, daysLeft / TOTAL_DAYS));
    const l = Math.round(lMin + ratio * (lMax - lMin));
    document.body.style.background = `hsl(${h}, ${s}%, ${l}%)`;
  }

  // ── 별 파티클 ──
  const canvas = document.getElementById('starfield');
  const ctx    = canvas.getContext('2d');
  let stars    = [];

  function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.2,
        alpha: Math.random(),
        speed: Math.random() * 0.004 + 0.001,
        drift: (Math.random() - 0.5) * 0.15,
      });
    }
  }
  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.alpha += s.speed;
      if (s.alpha > 1 || s.alpha < 0) s.speed *= -1;
      s.x += s.drift;
      if (s.x < 0) s.x = canvas.width;
      if (s.x > canvas.width) s.x = 0;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(240,234,216,${s.alpha * 0.5})`;
      ctx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  resizeCanvas(); initStars(); drawStars();
  window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

  // ── 1초 팩트 ──
  const oneSecFacts = [
    ['지금 이 <span>1초</span>로', '유튜브 쇼츠 <span>0.01개</span> 볼 수 있었다'],
    ['지금 이 <span>1초</span>로', '치킨 한 조각의 <span>0.003%</span>를 먹을 수 있었다'],
    ['지금 이 <span>1초</span>로', '카카오톡 메시지 <span>0.5개</span> 보낼 수 있었다'],
    ['지금 이 <span>1초</span>로', '넷플릭스 드라마 <span>0.004%</span>를 볼 수 있었다'],
    ['지금 이 <span>1초</span>로', '배달앱 화면 <span>2번</span> 스크롤할 수 있었다'],
    ['지금 이 <span>1초</span>로', '자유로운 숨을 <span>0.25번</span> 쉴 수 있었다'],
    ['지금 이 <span>1초</span>로', '인스타 릴스 <span>0.02개</span> 볼 수 있었다'],
    ['지금 이 <span>1초</span>로', '편의점 삼각김밥의 <span>0.001%</span>를 먹을 수 있었다'],
  ];
  let factIdx = 0;
  const onesecEl = document.getElementById('onesec');
  function showFact(idx) {
    const [a, b] = oneSecFacts[idx];
    onesecEl.style.opacity = '0';
    setTimeout(() => { onesecEl.innerHTML = `${a} ${b}`; onesecEl.style.opacity = '1'; }, 400);
  }
  showFact(0);
  setInterval(() => { factIdx = (factIdx + 1) % oneSecFacts.length; showFact(factIdx); }, 5000);

  // ── 메인 메시지 ──
  const messages = [
    ['지금 이 순간에도 시간은 흐르고 있다.', '<strong>도망칠 수 없다.</strong>'],
    ['유일한 탈출구는', '<strong>앞으로 나아가는 것뿐.</strong>'],
    ['훈련소 밥은 생각보다', '<strong>나쁘지 않다고 한다.</strong>'],
    ['머리는 어차피', '<strong>다 밀린다.</strong>'],
    ['아직 시간 있으니까', '<strong>지금 하고 싶은 거 다 해.</strong>'],
    ['이미 피할 수 없는', '<strong>운명이다.</strong>'],
  ];
  let msgIdx = 0;
  const msgEl = document.getElementById('message');
  function setMessage(idx) {
    const [a, b] = messages[idx];
    msgEl.style.opacity = '0';
    setTimeout(() => {
      msgEl.innerHTML = `${a}<br>${b}`;
      msgEl.style.transition = 'opacity 0.8s';
      msgEl.style.opacity = '1';
    }, 500);
  }
  setInterval(() => { msgIdx = (msgIdx + 1) % messages.length; setMessage(msgIdx); }, 30000);

  // ── 메인 업데이트 루프 ──
  function update() {
    const now  = new Date();
    const diff = ENLIST - now;

    if (diff <= 0) {
      document.getElementById('dday').textContent    = '0';
      document.getElementById('hours').textContent   = '00';
      document.getElementById('minutes').textContent = '00';
      document.getElementById('seconds').textContent = '00';
      msgEl.innerHTML = '수고해. <strong>잘 다녀와.</strong>';
      updateBg(0);
    } else {
      const totalSec = Math.floor(diff / 1000);
      const daysLeft = Math.floor(totalSec / 86400);
      document.getElementById('dday').textContent    = daysLeft;
      document.getElementById('hours').textContent   = pad(Math.floor((totalSec % 86400) / 3600));
      document.getElementById('minutes').textContent = pad(Math.floor((totalSec % 3600) / 60));
      document.getElementById('seconds').textContent = pad(totalSec % 60);
      updateBg(daysLeft);
    }

    // 카드 1: 전역까지
    const toDischarge   = DISCHARGE - now;
    const dischargeDays = Math.max(0, Math.ceil(toDischarge / 86400000));
    document.getElementById('discharge-days').textContent = dischargeDays.toLocaleString() + '일';
    document.getElementById('discharge-date').textContent = '전역 ' + formatDate(DISCHARGE);
    const serviceElapsed = now - ENLIST;
    const serviceTotal   = DISCHARGE - ENLIST;
    document.getElementById('discharge-bar').style.width =
      Math.min(100, Math.max(0, (serviceElapsed / serviceTotal) * 100)).toFixed(2) + '%';

    // 카드 2: 오늘 하루
    const midnight  = new Date(now); midnight.setHours(24,0,0,0);
    const todayLeft = midnight - now;
    const th = Math.floor(todayLeft / 3600000);
    const tm = Math.floor((todayLeft % 3600000) / 60000);
    const ts = Math.floor((todayLeft % 60000) / 1000);
    document.getElementById('today-remain').textContent = `${pad(th)}:${pad(tm)}:${pad(ts)}`;
    document.getElementById('today-bar').style.width =
      ((86400000 - todayLeft) / 86400000 * 100).toFixed(2) + '%';

    // 카드 3: 인생 헌납률
    const lifePct = ((DISCHARGE - ENLIST) / (LIFE_END - BIRTH)) * 100;
    document.getElementById('life-pct').textContent = lifePct.toFixed(2) + '%';
    document.getElementById('life-bar').style.width = Math.min(100, lifePct * 5) + '%';
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
