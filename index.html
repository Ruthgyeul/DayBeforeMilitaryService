<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-DAY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --olive: #4a5240;
      --olive-dark: #2e3328;
      --olive-light: #7a8c6e;
      --khaki: #b5a97a;
      --cream: #f0ead8;
      --red: #c0392b;
      --bg: #1a1c17;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--cream);
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden;
      transition: background 2s ease;
    }

    /* 격자 배경 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(74,82,64,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,82,64,0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* 별 캔버스 */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 2rem;
    }

    .badge {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--khaki);
      border: 1px solid var(--olive-light);
      padding: 0.35rem 1.2rem;
      text-transform: uppercase;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeDown 0.8s 0.2s forwards;
    }

    .name-label {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--cream);
      letter-spacing: 0.4em;
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeDown 0.8s 0.35s forwards;
    }

    .dday-wrapper {
      display: flex;
      align-items: baseline;
      gap: 0.2rem;
      margin-bottom: 0.5rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.5s forwards;
    }

    .dday-prefix {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      color: var(--olive-light);
      letter-spacing: -0.02em;
    }

    .dday-number {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(6rem, 20vw, 14rem);
      color: var(--cream);
      line-height: 0.85;
      letter-spacing: -0.04em;
    }

    .date-line {
      width: 100%;
      max-width: 600px;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.8rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.7s forwards;
    }

    .date-line::before,
    .date-line::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--olive-light));
    }
    .date-line::after {
      background: linear-gradient(90deg, var(--olive-light), transparent);
    }

    .date-text {
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 300;
      font-size: 0.9rem;
      letter-spacing: 0.25em;
      color: var(--khaki);
      white-space: nowrap;
    }

    .time-row {
      display: flex;
      gap: 2.5rem;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.9s forwards;
    }

    .time-unit { text-align: center; }

    .time-num {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: var(--cream);
      display: block;
      line-height: 1;
    }

    .time-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--olive-light);
      text-transform: uppercase;
      margin-top: 0.3rem;
      display: block;
    }

    .time-sep {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 2rem;
      color: var(--olive);
      align-self: flex-start;
      padding-top: 0.1rem;
    }

    /* 킹받는 메시지 */
    .message {
      font-size: clamp(0.75rem, 1.5vw, 0.85rem);
      font-weight: 300;
      color: var(--olive-light);
      letter-spacing: 0.05em;
      text-align: center;
      max-width: 440px;
      line-height: 1.8;
      opacity: 0;
      animation: fadeUp 0.8s 1.1s forwards;
      transition: opacity 0.6s;
      min-height: 3em;
    }

    .message strong {
      color: var(--khaki);
      font-weight: 700;
    }

    /* 지금 이 1초로 할 수 있는 것 */
    .onesec {
      margin-top: 0.6rem;
      font-size: 0.7rem;
      font-weight: 300;
      color: var(--olive-light);
      letter-spacing: 0.04em;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.8s 1.2s forwards;
      transition: opacity 0.5s;
      min-height: 1.5em;
    }

    .onesec span {
      color: var(--khaki);
      font-weight: 700;
    }

    /* 스탯 카드 3개 */
    .stats-row {
      display: flex;
      gap: 0.8rem;
      width: 100%;
      max-width: 560px;
      margin-top: 1.4rem;
      opacity: 0;
      animation: fadeUp 0.8s 1.3s forwards;
    }

    .stat-card {
      flex: 1;
      border: 1px solid var(--olive);
      padding: 0.85rem 0.75rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(74,82,64,0.07);
      pointer-events: none;
    }

    .stat-title {
      font-size: 0.52rem;
      letter-spacing: 0.15em;
      color: var(--olive-light);
      text-transform: uppercase;
    }

    .stat-value {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(1rem, 2.2vw, 1.45rem);
      color: var(--cream);
      line-height: 1;
    }

    .stat-sub {
      font-size: 0.58rem;
      color: var(--khaki);
      letter-spacing: 0.04em;
      line-height: 1.5;
    }

    .stat-bar {
      width: 100%;
      height: 2px;
      background: var(--olive-dark);
      margin-top: 0.15rem;
    }

    .stat-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--olive-light), var(--khaki));
      transition: width 1s linear;
    }

    /* 하단 도장 */
    .stamp {
      position: fixed;
      bottom: 2rem;
      right: 2.5rem;
      opacity: 0;
      animation: fadeIn 1s 1.5s forwards;
    }

    .stamp-inner {
      border: 2px solid var(--red);
      padding: 0.4rem 0.9rem;
      transform: rotate(-8deg);
      font-family: 'Black Han Sans', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      color: var(--red);
      opacity: 0.6;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-15px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .blink { animation: pulse 1s infinite; }
  </style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="container">
  <div class="badge">MANDATORY MILITARY SERVICE</div>
  <div class="name-label">유한빈</div>

  <div class="dday-wrapper">
    <span class="dday-prefix">D-</span>
    <span class="dday-number" id="dday">---</span>
  </div>

  <div class="date-line">
    <span class="date-text">2026. 09. 28 입대</span>
  </div>

  <div class="time-row">
    <div class="time-unit">
      <span class="time-num" id="hours">--</span>
      <span class="time-label">시간</span>
    </div>
    <span class="time-sep">:</span>
    <div class="time-unit">
      <span class="time-num" id="minutes">--</span>
      <span class="time-label">분</span>
    </div>
    <span class="time-sep">:</span>
    <div class="time-unit">
      <span class="time-num blink" id="seconds">--</span>
      <span class="time-label">초</span>
    </div>
  </div>

  <div class="message" id="message">
    지금 이 순간에도 시간은 흐르고 있다.<br>
    <strong>도망칠 수 없다.</strong>
  </div>

  <div class="onesec" id="onesec"></div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-title">전역까지</div>
      <div class="stat-value" id="discharge-days">---일</div>
      <div class="stat-sub" id="discharge-date">--</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="discharge-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-title">오늘의 자유</div>
      <div class="stat-value" id="today-remain">--:--</div>
      <div class="stat-sub">자정까지 남은 시간</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="today-bar" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-title">인생 헌납률</div>
      <div class="stat-value" id="life-pct">--%</div>
      <div class="stat-sub">평균수명 83세 기준<br>군대에 뺏기는 시간</div>
      <div class="stat-bar"><div class="stat-bar-fill" id="life-bar" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="stamp">
  <div class="stamp-inner">입영 예정</div>
</div>

<script>
  // ── 설정 ──
  const ENLIST   = new Date('2026-09-28T06:00:00');
  const DISCHARGE = new Date(ENLIST);
  DISCHARGE.setMonth(DISCHARGE.getMonth() + 18);
  const BIRTH = new Date('2003-01-01T00:00:00');
  const LIFE_END = new Date(BIRTH);
  LIFE_END.setFullYear(LIFE_END.getFullYear() + 83);

  // ── 오늘 기준 총 일수 (배경 어둡기용) ──
  const TODAY_REF = new Date();
  TODAY_REF.setHours(0,0,0,0);
  const TOTAL_DAYS = Math.ceil((ENLIST - TODAY_REF) / 86400000);

  // ── 별 파티클 ──
  const canvas = document.getElementById('starfield');
  const ctx    = canvas.getContext('2d');
  let stars    = [];

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x:       Math.random() * canvas.width,
        y:       Math.random() * canvas.height,
        r:       Math.random() * 1.2 + 0.2,
        alpha:   Math.random(),
        speed:   Math.random() * 0.004 + 0.001,
        drift:   (Math.random() - 0.5) * 0.15,
      });
    }
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      s.alpha += s.speed;
      if (s.alpha > 1 || s.alpha < 0) s.speed *= -1;
      s.x += s.drift;
      if (s.x < 0) s.x = canvas.width;
      if (s.x > canvas.width) s.x = 0;

      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(240,234,216,${s.alpha * 0.6})`;
      ctx.fill();
    });
    requestAnimationFrame(drawStars);
  }

  resizeCanvas();
  initStars();
  drawStars();
  window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

  // ── 1초로 할 수 있는 것 ──
  const oneSecFacts = [
    ['지금 이 <span>1초</span>로', '유튜브 쇼츠 <span>0.01개</span> 봤을 수 있었다'],
    ['지금 이 <span>1초</span>로', '치킨 한 조각의 <span>0.003%</span>를 먹을 수 있었다'],
    ['지금 이 <span>1초</span>로', '카카오톡 메시지 <span>0.5개</span> 보낼 수 있었다'],
    ['지금 이 <span>1초</span>로', '넷플릭스 드라마 <span>0.004%</span>를 볼 수 있었다'],
    ['지금 이 <span>1초</span>로', '배달앱 화면 <span>2번</span> 스크롤할 수 있었다'],
    ['지금 이 <span>1초</span>로', '자유로운 숨을 <span>0.25번</span> 쉴 수 있었다'],
    ['지금 이 <span>1초</span>로', '인스타 릴스 <span>0.02개</span> 볼 수 있었다'],
    ['지금 이 <span>1초</span>로', '편의점 삼각김밥의 <span>0.001%</span>를 먹을 수 있었다'],
  ];

  let factIdx   = 0;
  let msgIdx    = 0;
  const onesecEl = document.getElementById('onesec');
  const msgEl    = document.getElementById('message');

  function showFact(idx) {
    const [line1, line2] = oneSecFacts[idx];
    onesecEl.style.opacity = '0';
    setTimeout(() => {
      onesecEl.innerHTML = `${line1} ${line2}`;
      onesecEl.style.opacity = '1';
    }, 400);
  }

  showFact(0);
  setInterval(() => {
    factIdx = (factIdx + 1) % oneSecFacts.length;
    showFact(factIdx);
  }, 5000);

  const messages = [
    ['지금 이 순간에도 시간은 흐르고 있다.', '<strong>도망칠 수 없다.</strong>'],
    ['유일한 탈출구는', '<strong>앞으로 나아가는 것뿐.</strong>'],
    ['훈련소 밥은 생각보다', '<strong>나쁘지 않다고 한다.</strong>'],
    ['머리는 어차피', '<strong>다 밀린다.</strong>'],
    ['아직 시간 있으니까', '<strong>지금 하고 싶은 거 다 해.</strong>'],
    ['이미 피할 수 없는', '<strong>운명이다.</strong>'],
  ];

  function setMessage(idx) {
    const [line1, line2] = messages[idx];
    msgEl.style.opacity = '0';
    setTimeout(() => {
      msgEl.innerHTML = `${line1}<br>${line2}`;
      msgEl.style.transition = 'opacity 0.8s';
      msgEl.style.opacity = '1';
    }, 500);
  }

  setInterval(() => {
    msgIdx = (msgIdx + 1) % messages.length;
    setMessage(msgIdx);
  }, 30000);

  // ── 배경 어둡기: 남은 날 적을수록 더 어두워짐 ──
  function updateBgDarkness(daysLeft) {
    // TOTAL_DAYS일 때 밝음(기본), 0일 때 완전 어두움
    const ratio = Math.max(0, Math.min(1, daysLeft / TOTAL_DAYS)); // 1=밝음, 0=어두움
    // base hue: 26, lightness 17 → 5
    const lightness = Math.round(5 + ratio * 12); // 5~17
    const saturation = Math.round(3 + ratio * 5);  // 3~8
    document.body.style.background = `hsl(82, ${saturation}%, ${lightness}%)`;
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function formatDate(d) {
    return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
  }

  function update() {
    const now = new Date();

    // ── 메인 D-day ──
    const diff = ENLIST - now;
    if (diff <= 0) {
      document.getElementById('dday').textContent    = '0';
      document.getElementById('hours').textContent   = '00';
      document.getElementById('minutes').textContent = '00';
      document.getElementById('seconds').textContent = '00';
      msgEl.innerHTML = '수고해. <strong>잘 다녀와.</strong>';
      updateBgDarkness(0);
    } else {
      const totalSec = Math.floor(diff / 1000);
      const daysLeft = Math.floor(totalSec / 86400);
      document.getElementById('dday').textContent    = daysLeft;
      document.getElementById('hours').textContent   = pad(Math.floor((totalSec % 86400) / 3600));
      document.getElementById('minutes').textContent = pad(Math.floor((totalSec % 3600) / 60));
      document.getElementById('seconds').textContent = pad(totalSec % 60);
      updateBgDarkness(daysLeft);
    }

    // ── 카드 1: 전역까지 ──
    const toDischarge   = DISCHARGE - now;
    const dischargeDays = Math.max(0, Math.ceil(toDischarge / 86400000));
    document.getElementById('discharge-days').textContent = dischargeDays.toLocaleString() + '일';
    document.getElementById('discharge-date').textContent = '전역 ' + formatDate(DISCHARGE);
    const serviceElapsed = now - ENLIST;
    const serviceTotal   = DISCHARGE - ENLIST;
    const dischargePct   = Math.min(100, Math.max(0, (serviceElapsed / serviceTotal) * 100));
    document.getElementById('discharge-bar').style.width = dischargePct.toFixed(2) + '%';

    // ── 카드 2: 오늘 하루 남은 시간 ──
    const midnight  = new Date(now);
    midnight.setHours(24, 0, 0, 0);
    const todayLeft = midnight - now;
    const th = Math.floor(todayLeft / 3600000);
    const tm = Math.floor((todayLeft % 3600000) / 60000);
    const ts = Math.floor((todayLeft % 60000) / 1000);
    document.getElementById('today-remain').textContent = `${pad(th)}:${pad(tm)}:${pad(ts)}`;
    const dayPct = ((86400000 - todayLeft) / 86400000) * 100;
    document.getElementById('today-bar').style.width = dayPct.toFixed(2) + '%';

    // ── 카드 3: 인생 헌납률 ──
    const lifeTotal       = LIFE_END - BIRTH;
    const serviceDuration = DISCHARGE - ENLIST;
    const lifePct         = (serviceDuration / lifeTotal) * 100;
    document.getElementById('life-pct').textContent  = lifePct.toFixed(2) + '%';
    document.getElementById('life-bar').style.width  = Math.min(100, lifePct * 5) + '%';
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
